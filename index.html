<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMX Tracks in California — Post Millennium Renaissance</title>
<meta name="description" content="An interactive atlas of 127 BMX race tracks in California — active, unconfirmed and closed — from the 1969 birthplace of the sport to today.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23141619'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial Narrow,Arial' font-weight='bold' fill='%23ffd23f'>B</text></svg>">

<!-- ==========================================================================
     BMX TRACKS IN CALIFORNIA — Post Millennium Renaissance
     Single-file HTML. Zero external dependencies. No CDN, no build step.

     ARCHITECTURE / HOW TO EXTEND  (read this first)
     --------------------------------------------------------------------------
     Everything you would normally want to change lives in the CONFIG and DATA
     blocks near the top of the script block below. You should not need to
     touch the rendering code to add content.

       ADD A TRACK ............ push an object into DATA.tracks
       ADD A STATE ............ add an outline to MAPS + tracks with that state
       ADD A COUNTY/REGION .... add a key to DATA.regions, use it on a track
       ADD A COLOR SCHEME ..... add an object to THEMES
       ADD A TAB .............. add an entry to TABS with a render function
       ADD A CHART ............ call Chart.xy / Chart.bars / Chart.gantt
       EDIT GROWTH ESTIMATES .. DATA.growth
       EDIT TRENDS DATA ....... DATA.trends
       EDIT LEAGUES ........... DATA.leagues

     CONFIDENCE TIERS are attached to individual records, not to the page.
     Anything labelled "estimated" or "draft" should not be cited as fact.
     ========================================================================== -->

<style>
/* ==========================================================================
   1. THEME TOKENS
   Each theme in the THEMES object writes these custom properties onto <html>.
   To add a scheme, add an object to THEMES — no CSS changes required.
   ========================================================================== */
:root{
  --bg:#141619; --bg-alt:#1a1d22; --surface:#20242b; --surface-2:#272c34;
  --line:#333a44; --line-soft:#2a2f37;
  --text:#f2f1ec; --text-dim:#9aa3af; --text-faint:#6b7280;
  --accent:#ffd23f; --accent-2:#e5484d; --accent-3:#4cc2ff;
  --ok:#5ec26a; --warn:#f0a33a; --bad:#e5484d; --ghost:#7c8794;
  --plate-bg:#f2f1ec; --plate-ink:#141619;
  --grid:rgba(255,255,255,.07);
  --land:#242931; --land-line:#4a5361;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --radius:3px;

  --font-display:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed","Liberation Sans Narrow",Impact,system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
a{color:var(--accent-3)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em;line-height:1.08}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ==========================================================================
   3. HEADER
   ========================================================================== */
.top{border-bottom:1px solid var(--line);background:var(--bg-alt);position:sticky;top:0;z-index:60}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 18px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.home-link{
  font-family:var(--font-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-dim);text-decoration:none;border:1px solid var(--line);
  padding:5px 10px;border-radius:var(--radius);white-space:nowrap;transition:.15s;
}
.home-link:hover{color:var(--text);border-color:var(--accent);background:var(--surface)}
.top-title{flex:1;min-width:180px;font-family:var(--font-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.top-title small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--text-faint);font-weight:400}
.theme-switch{display:flex;gap:6px;align-items:center}
.theme-name{
  font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);margin-right:2px;white-space:nowrap;
}
@media(max-width:400px){.theme-name{display:none}}
.theme-btn{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  padding:0;position:relative;overflow:hidden;transition:.15s;
}
.theme-btn:hover{transform:scale(1.12)}
.theme-btn[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.theme-btn.shimmer::after{
  content:"";position:absolute;inset:-60%;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);
  animation:themeShimmer 1.1s ease;
}
@keyframes themeShimmer{
  from{transform:translateX(-140%) rotate(6deg);}
  to{transform:translateX(140%) rotate(6deg);}
}

/* ==========================================================================
   4. HERO BAND
   Full-bleed panel behind the page title, optionally carrying a repeating
   tile set from CONFIG.hero. The artwork is dark in every theme, so this
   band forces a light-on-dark palette locally, whatever scheme is active.
   If the image file is missing the band falls back to a plain dark panel,
   so the page never looks broken.
   ========================================================================== */
.hero-band{
  position:relative;
  border-bottom:1px solid var(--line);
  background-color:#232329;                    /* shows through if no tile */
  background-image:var(--hero-art,none);
  /* repeat-x only: the artwork tiles cleanly left-to-right but its top and
     bottom edges do not match, so a full `repeat` would show a seam. One
     vertical repeat, centered, avoids it entirely. */
  background-repeat:repeat-x;
  background-size:var(--hero-tile,420px) auto;
  background-position:center center;
  /* Local palette override — light type regardless of the active theme */
  --text:#f7f5f0;
  --text-dim:#d3cdc4;
  --text-faint:#a7a099;
}
.hero-band::after{                             /* legibility scrim */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:rgba(17,17,21,var(--hero-scrim,.78));
}
.hero-inner{position:relative;z-index:1;padding:42px 0 36px}
.hero-inner .eyebrow{color:var(--hero-accent,var(--accent))}
.hero-inner h1{
  font-size:clamp(38px,8vw,74px);text-transform:uppercase;letter-spacing:-.005em;
  color:var(--text);text-shadow:0 2px 14px rgba(0,0,0,.6);
}
.hero-inner h1 em{font-style:normal;color:var(--hero-accent,var(--accent))}
.hero-inner p{
  max-width:62ch;color:var(--text-dim);margin:14px 0 0;font-size:15.5px;
  text-shadow:0 1px 10px rgba(0,0,0,.7);
}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;
}
/* Band below the artwork, holding the origin card */
.hero{padding:22px 0 2px}

/* ---- The birthplace card: collapsed by default ---- */
.origin{
  margin:22px 0 0;border:1px solid var(--line);border-left:4px solid var(--accent);
  background:var(--surface);border-radius:var(--radius);overflow:hidden;
}
.origin-btn{
  width:100%;background:none;border:0;text-align:left;display:flex;
  align-items:center;gap:14px;padding:15px 18px;
}
.origin-btn:hover{background:var(--surface-2)}
.origin-yr{
  font-family:var(--font-display);font-size:30px;color:var(--accent);
  line-height:1;letter-spacing:.02em;flex:none;
}
.origin-lab{flex:1;min-width:0}
.origin-lab b{
  display:block;font-family:var(--font-display);font-size:16px;
  text-transform:uppercase;letter-spacing:.05em;
}
.origin-lab span{display:block;font-size:12.5px;color:var(--text-dim)}
.origin-chev{flex:none;color:var(--text-dim);font-size:12px;transition:transform .22s;font-family:var(--font-mono)}
.origin[data-open="true"] .origin-chev{transform:rotate(90deg)}
.origin-body{
  padding:0 18px 20px;border-top:1px solid var(--line-soft);
  max-width:78ch;
}
.origin-body p{margin:14px 0 0;font-size:14.5px;color:var(--text-dim)}
.origin-body p strong{color:var(--text)}
.origin-facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--line-soft);margin:18px 0 0;border:1px solid var(--line-soft);
}
.origin-facts div{background:var(--surface);padding:10px 12px}
.origin-facts dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-mono)}
.origin-facts dd{margin:3px 0 0;font-size:13.5px;font-weight:600}

/* ==========================================================================
   5. TABS
   ========================================================================== */
.tabs{
  position:sticky;top:47px;z-index:50;background:var(--bg);
  border-bottom:1px solid var(--line);margin-top:22px;
}
.tabs-in{display:flex;gap:0;overflow-x:auto;max-width:1180px;margin:0 auto;padding:0 18px;scrollbar-width:thin}
.tab{
  background:none;border:0;border-bottom:3px solid transparent;
  padding:12px 15px;white-space:nowrap;color:var(--text-faint);
  font-family:var(--font-display);font-size:14px;letter-spacing:.07em;text-transform:uppercase;
  transition:.15s;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .tab-n{font-family:var(--font-mono);font-size:10px;opacity:.5;margin-right:6px}
.panel{padding:28px 0 60px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ==========================================================================
   6. GENERIC BLOCKS
   ========================================================================== */
.sec{margin:0 0 34px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;flex-wrap:wrap}
.sec-head h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sec-head .rule{flex:1;height:1px;background:var(--line);min-width:20px}
.sec-note{color:var(--text-dim);font-size:13.5px;margin:0 0 16px;max-width:74ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}

/* Number-plate KPI tiles — the plate is BMX's own artifact, so the stat cards
   borrow its proportions: heavy border, condensed numeral, small caption. */
.ov-top{display:flex;gap:18px;align-items:stretch;margin-bottom:26px}
.mini-map{
  flex:0 0 33%;min-width:200px;max-width:300px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px;position:relative;overflow:hidden;transition:border-color .15s;
}
.mini-map:hover{border-color:var(--accent)}
.mini-map:hover .mini-map-cta{opacity:1;transform:translateY(0)}
.mini-map svg{width:100%;height:auto;display:block}
.mini-map-cta{
  position:absolute;left:8px;right:8px;bottom:8px;
  background:var(--accent);color:var(--plate-ink);
  font-family:var(--font-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  padding:7px 0;border-radius:2px;text-align:center;font-weight:700;
  opacity:0;transform:translateY(4px);transition:.15s;
}
.ov-top .plates{flex:1;margin-bottom:0}
@media(max-width:720px){
  .ov-top{flex-direction:column}
  .mini-map{max-width:none;flex:none}
  .mini-map-cta{opacity:1;transform:none}   /* always visible once touch is the norm */
}
.plates{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 26px}
.plate{
  background:var(--plate-bg);color:var(--plate-ink);border:3px solid var(--plate-ink);
  border-radius:6px;padding:12px 14px 10px;position:relative;box-shadow:var(--shadow);
}
.plate::after{
  content:"";position:absolute;inset:3px;border:1px solid rgba(0,0,0,.22);border-radius:3px;pointer-events:none;
}
.plate b{display:block;font-family:var(--font-display);font-size:44px;line-height:.92;letter-spacing:-.02em}
.plate span{
  display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;margin-top:6px;opacity:.7;
}
.plate.is-accent{background:var(--accent);border-color:var(--plate-ink)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 10px}
.chart-card h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.chart-card .sub{font-size:12px;color:var(--text-faint);margin-bottom:12px}
.chart-card svg{width:100%;height:auto;display:block;overflow:visible}

/* Confidence chips */
.chip{
  display:inline-block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap;
}
.chip.verified{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.estimated{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.draft{color:var(--ghost);border-color:color-mix(in srgb,var(--ghost) 45%,transparent);background:color-mix(in srgb,var(--ghost) 12%,transparent)}

.badge{
  display:inline-block;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;
  padding:1px 5px;border-radius:2px;background:var(--accent);color:var(--plate-ink);
  font-weight:700;vertical-align:1px;cursor:help;
}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* ==========================================================================
   7. MAP
   ========================================================================== */
.zoom-bar{display:flex;gap:6px;margin:0 0 14px}
.zoom-btn{
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  padding:7px 14px;border-radius:var(--radius);font-size:12.5px;
  font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase;
}
.zoom-btn:hover{color:var(--text);border-color:var(--accent-3)}
.zoom-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--plate-ink);font-weight:700}
.map-shell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
#mapSvg{width:100%;height:auto;display:block;touch-action:manipulation}
.state-land{fill:var(--land);stroke:var(--land-line);stroke-width:1.1;stroke-linejoin:round}
.mk{cursor:pointer;transition:opacity .15s}
.mk:hover .mk-hit{opacity:.16}
.mk.dim{opacity:.12;pointer-events:none}
.mk-hit{fill:var(--accent);opacity:0}
.map-tip{
  position:absolute;pointer-events:none;background:var(--bg-alt);border:1px solid var(--accent);
  border-radius:var(--radius);padding:8px 10px;font-size:12.5px;max-width:230px;z-index:20;
  box-shadow:var(--shadow);opacity:0;transition:opacity .12s;
}
.map-tip b{display:block;font-family:var(--font-display);font-size:14px;letter-spacing:.03em}
.map-tip i{font-style:normal;color:var(--text-dim);display:block;font-size:11.5px;margin-top:2px}
.map-legend{
  display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px;
}
.map-legend span{display:flex;align-items:center;gap:7px;color:var(--text-dim)}

/* ==========================================================================
   8. CONTROLS / DIRECTORY
   ========================================================================== */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-wrap::before{
  content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);
  color:var(--text-faint);font-size:17px;
}
input[type="search"],select{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
  padding:9px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px;
}
input[type="search"]{padding-left:30px}
input[type="search"]::-webkit-search-cancel-button{filter:invert(.6)}
select{width:auto;min-width:150px;cursor:pointer}
.btn-clear{
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  padding:9px 13px;border-radius:var(--radius);font-size:13px;
}
.btn-clear:hover{color:var(--text);border-color:var(--accent)}
.result-count{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin:0 0 10px}

.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:820px}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 12px;
  font-family:var(--font-display);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-dim);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--text)}
thead th .arw{opacity:.4;font-size:9px;margin-left:4px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.t-name{font-weight:600}
.t-name a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--text-faint)}
.t-name a:hover{color:var(--accent-3);border-color:var(--accent-3)}
.t-sub{display:block;font-size:11.5px;color:var(--text-faint);font-weight:400;margin-top:1px}
.district{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.05em}
.empty{padding:44px 20px;text-align:center;color:var(--text-dim)}
.empty b{display:block;font-family:var(--font-display);font-size:19px;text-transform:uppercase;margin-bottom:6px;color:var(--text)}

/* ==========================================================================
   9. TIMELINE / MISC
   ========================================================================== */
.statdefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.statdef{background:var(--surface);padding:11px 14px}
.statdef b{font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.statdef span:last-child{display:block;font-size:12.5px;color:var(--text-dim);margin-top:3px;line-height:1.45}
.legend-inline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-dim);margin-top:10px}
.legend-inline span{display:flex;align-items:center;gap:6px}
.callout{
  border-left:3px solid var(--accent-3);background:var(--surface);padding:12px 16px;
  border-radius:0 var(--radius) var(--radius) 0;font-size:13.5px;color:var(--text-dim);margin:16px 0;
}
.callout b{color:var(--text)}
.src-list{list-style:none;padding:0;margin:0;display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.src-list li{background:var(--surface);padding:12px 14px}
.src-list b{display:block;font-size:13.5px;margin-bottom:2px}
.src-list span{font-size:12.5px;color:var(--text-dim)}
.foot{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--text-faint);font-size:12.5px}
.foot a{color:var(--text-dim)}

@media(max-width:640px){
  .hero-inner{padding:28px 0 24px}
  .plate b{font-size:34px}
  .tabs{top:82px}
  .top-in{padding:8px 14px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <!-- HOMEPAGE LINK — edit CONFIG.site.homeUrl to change.
         target="_top" is required: this page is embedded in an iframe on
         postmillenniumrenaissance.com/bmx/, so a plain link only navigates
         the iframe and the visible address bar never changes. -->
    <a class="home-link" id="homeLink" href="#" target="_top">← PMR</a>
    <div class="top-title">BMX Tracks in California<small id="topSub">Loading…</small></div>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Color scheme"></div>
  </div>
</header>

<main>
  <!-- Full-bleed artwork band. The tile comes from CONFIG.hero. -->
  <section class="hero-band" id="heroBand">
    <div class="wrap">
      <div class="hero-inner">
        <div class="eyebrow">Post Millennium Renaissance · Track Atlas</div>
        <h1>BMX Tracks in <em>California</em></h1>
        <p id="heroSub"></p>
      </div>
    </div>
  </section>

  <div class="wrap">
    <section class="hero">
      <!-- ORIGIN CARD — collapsed by default, expands to the 1969 story -->
      <div class="origin" id="originCard" data-open="false">
        <button class="origin-btn" id="originBtn" aria-expanded="false" aria-controls="originBody">
          <span class="origin-yr" id="originYear">1969</span>
          <span class="origin-lab">
            <b id="originTitle">The first track</b>
            <span id="originTease"></span>
          </span>
          <span class="origin-chev">▶</span>
        </button>
        <div class="origin-body hidden" id="originBody"></div>
      </div>
    </section>
  </div>

  <nav class="tabs"><div class="tabs-in" id="tabBar" role="tablist"></div></nav>
  <div class="wrap"><div id="panels"></div></div>
</main>

<footer class="foot">
  <div class="wrap">
    <p id="footText"></p>

/* ==========================================================================
   CHART ENGINE — hand-rolled SVG. No dependencies.
   Chart.xy()    line / band / scatter over a numeric x axis
   Chart.bars()  horizontal category bars
   Chart.gantt() parallel time spans
   Each returns an SVG string. Colors come from CSS variables so charts
   restyle themselves automatically when the theme changes.
   ========================================================================== */
const Chart = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const n = v => Math.round(v*100)/100;

  function xy(o){
    const W=o.width||760, H=o.height||330;
    const m={t:o.mt??18, r:o.mr??18, b:o.mb??38, l:o.ml??42};
    const iw=W-m.l-m.r, ih=H-m.t-m.b;
    const xMin=o.xMin, xMax=o.xMax, yMin=o.yMin??0, yMax=o.yMax;
    const X = v => m.l + (v-xMin)/(xMax-xMin)*iw;
    const Y = v => m.t + ih - (v-yMin)/(yMax-yMin)*ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"chart")}">`;

    // horizontal gridlines + y labels
    const ticks = o.yTicks||5;
    for(let i=0;i<=ticks;i++){
      const val = yMin + (yMax-yMin)*i/ticks, y=Y(val);
      s += `<line x1="${m.l}" y1="${n(y)}" x2="${W-m.r}" y2="${n(y)}" stroke="var(--grid)" stroke-width="1"/>`;
      s += `<text x="${m.l-8}" y="${n(y)+4}" text-anchor="end" font-size="10" font-family="var(--font-mono)" fill="var(--text-faint)">${o.yFmt?o.yFmt(val):Math.round(val)}</text>`;
    }
    // x labels
    (o.xTicks||[]).forEach(t=>{
      const x=X(t);
      s += `<line x1="${n(x)}" y1="${m.t}" x2="${n(x)}" y2="${m.t+ih}" stroke="var(--grid)" stroke-width="1"/>`;
      s += `<text x="${n(x)}" y="${m.t+ih+16}" text-anchor="middle" font-size="10" font-family="var(--font-mono)" fill="var(--text-faint)">${esc(t)}</text>`;
    });

    // event annotations (vertical dashed markers)
    (o.events||[]).forEach((ev,i)=>{
      const x=X(ev.year);
      s += `<line x1="${n(x)}" y1="${m.t}" x2="${n(x)}" y2="${m.t+ih}" stroke="var(--accent-2)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
      s += `<circle cx="${n(x)}" cy="${m.t-6}" r="7" fill="var(--accent-2)" opacity=".9"/>`;
      s += `<text x="${n(x)}" y="${m.t-2.5}" text-anchor="middle" font-size="9" font-weight="700" font-family="var(--font-mono)" fill="var(--bg)">${i+1}</text>`;
    });

    // uncertainty band
    if(o.band){
      const up = o.band.map(p=>`${n(X(p.x))},${n(Y(p.hi))}`).join(" ");
      const dn = o.band.slice().reverse().map(p=>`${n(X(p.x))},${n(Y(p.lo))}`).join(" ");
      s += `<polygon points="${up} ${dn}" fill="${o.bandColor||"var(--accent)"}" opacity=".16"/>`;
      s += `<polyline points="${up}" fill="none" stroke="${o.bandColor||"var(--accent)"}" stroke-width="1" opacity=".4" stroke-dasharray="4 3"/>`;
      s += `<polyline points="${o.band.map(p=>`${n(X(p.x))},${n(Y(p.lo))}`).join(" ")}" fill="none" stroke="${o.bandColor||"var(--accent)"}" stroke-width="1" opacity=".4" stroke-dasharray="4 3"/>`;
    }

    // series
    (o.series||[]).forEach(ser=>{
      const pts = ser.points.map(p=>`${n(X(p.x))},${n(Y(p.y))}`).join(" ");
      if(ser.fill){
        s += `<polygon points="${pts} ${n(X(ser.points[ser.points.length-1].x))},${n(Y(yMin))} ${n(X(ser.points[0].x))},${n(Y(yMin))}" fill="${ser.color}" opacity=".13"/>`;
      }
      s += `<polyline points="${pts}" fill="none" stroke="${ser.color}" stroke-width="${ser.w||2.4}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(ser.dots!==false){
        ser.points.forEach(p=>{
          const isAnchor = p.anchor;
          s += `<circle cx="${n(X(p.x))}" cy="${n(Y(p.y))}" r="${isAnchor?5.5:3.6}" fill="${isAnchor?"var(--bg)":ser.color}" stroke="${ser.color}" stroke-width="${isAnchor?3:0}"><title>${esc(p.title||(p.x+": "+p.y))}</title></circle>`;
        });
      }
    });

    s += `</svg>`;
    return s;
  }

  function bars(o){
    const rows=o.rows, rowH=o.rowH||30, labelW=o.labelW||190;
    const W=o.width||760, H=rows.length*rowH+16;
    const iw = W-labelW-56;
    const max = o.max || Math.max(...rows.map(r=>r.segments.reduce((a,b)=>a+b.v,0)),1);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"bar chart")}">`;
    rows.forEach((r,i)=>{
      const y=i*rowH+8, bh=rowH-13;
      s+=`<text x="0" y="${y+bh*0.75}" font-size="12" fill="var(--text-dim)" font-family="var(--font-body)">${esc(r.label)}</text>`;
      let x=labelW, total=0;
      r.segments.forEach(seg=>{
        const w=seg.v/max*iw; total+=seg.v;
        if(w>0) s+=`<rect x="${n(x)}" y="${y}" width="${n(Math.max(w,1.5))}" height="${bh}" fill="${seg.color}" opacity="${seg.opacity??.85}"><title>${esc(seg.label+": "+seg.v)}</title></rect>`;
        x+=w;
      });
      s+=`<text x="${n(x+8)}" y="${y+bh*0.75}" font-size="11.5" font-family="var(--font-mono)" fill="var(--text-faint)">${total}</text>`;
    });
    s+=`</svg>`; return s;
  }

  function gantt(o){
    const items=o.items, rowH=o.rowH||42, labelW=o.labelW||96;
    const W=o.width||760, H=items.length*rowH+40;
    const x0=labelW, iw=W-labelW-16;
    const X = y => x0 + (y-o.minYear)/(o.maxYear-o.minYear)*iw;
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"timeline")}">`;
    // decade gridlines
    for(let y=Math.ceil(o.minYear/10)*10; y<=o.maxYear; y+=10){
      s+=`<line x1="${n(X(y))}" y1="0" x2="${n(X(y))}" y2="${items.length*rowH}" stroke="var(--grid)" stroke-width="1"/>`;
      s+=`<text x="${n(X(y))}" y="${items.length*rowH+18}" text-anchor="middle" font-size="10" font-family="var(--font-mono)" fill="var(--text-faint)">${y}</text>`;
    }
    items.forEach((it,i)=>{
      const y=i*rowH+10, bh=rowH-22;
      const end = it.end ?? o.maxYear;
      const xa=X(it.start), xb=X(end);
      s+=`<text x="0" y="${y+bh*0.72}" font-size="12.5" font-weight="700" font-family="var(--font-display)" fill="var(--text)" letter-spacing=".04em">${esc(it.abbr)}</text>`;
      s+=`<rect x="${n(xa)}" y="${y}" width="${n(Math.max(xb-xa,3))}" height="${bh}" rx="2" fill="${it.color}" opacity=".9"><title>${esc(it.abbr+" — "+it.name+" ("+it.start+"–"+(it.end??"present")+")")}</title></rect>`;
      // open-ended marker
      if(it.end===null){
        s+=`<polygon points="${n(xb)},${y} ${n(xb+9)},${y+bh/2} ${n(xb)},${y+bh}" fill="${it.color}"/>`;
      }
      const lbl = it.start+"–"+(it.end??"now");
      s+=`<text x="${n(xa+6)}" y="${y+bh*0.72}" font-size="10.5" font-family="var(--font-mono)" fill="var(--bg)" opacity=".85">${esc(lbl)}</text>`;
    });
    s+=`</svg>`; return s;
  }

  return {xy,bars,gantt,esc};
})();

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $  = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.from((el||document).querySelectorAll(s));
const esc = Chart.esc;
const isClosed = t => t.s === "closed";
const isRacing = t => STATUS[t.s]?.racing === true;   // confirmed holding races now
const flagsOf  = t => Object.keys(FLAGS).filter(k => t[k] === true);
/* Marker/badge opacity carries confidence: the fainter it is, the thinner
   the evidence. One rule, applied everywhere. */
const CONF_ALPHA = {verified:1, estimated:0.72, draft:0.45};
const confAlpha = t => CONF_ALPHA[t.conf] ?? 1;
const regionLabel = k => DATA.regions[k]?.label || k;

function statusColor(k){ return STATUS[k]?.color || "var(--text-dim)"; }

/* Marker geometry — one shape per status, nothing else. */
function markerPath(shape,x,y,c){
  switch(shape){
    case "dot":     return `<circle cx="${x}" cy="${y}" r="5" fill="${c}" stroke="var(--bg)" stroke-width="1.2"/>`;
    case "hollow":  return `<circle cx="${x}" cy="${y}" r="4.4" fill="var(--bg)" stroke="${c}" stroke-width="2" stroke-dasharray="2.2 1.8"/>`;
    case "square":  return `<rect x="${x-4.2}" y="${y-4.2}" width="8.4" height="8.4" fill="${c}" stroke="var(--bg)" stroke-width="1.2" rx="1"/>`;
    case "ring":    return `<circle cx="${x}" cy="${y}" r="4.6" fill="none" stroke="${c}" stroke-width="2.2"/>`;
    default:        return `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`;
  }
}

/* Flag decoration — drawn *around* the status marker, never instead of it.
   A track keeps its status shape and gains a ring or a star. */
function flagPath(flag,x,y){
  if(flag==="national")  return `<circle cx="${x}" cy="${y}" r="9.5" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".8"/>`;
  if(flag==="birthplace"){
    let pts=[];
    for(let i=0;i<10;i++){
      const r = i%2===0 ? 13 : 5.8, a=(Math.PI/5)*i - Math.PI/2;
      pts.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`);
    }
    return `<polygon points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.7"/>`;
  }
  return "";
}

/* ==========================================================================
   THEME
   ========================================================================== */
function applyTheme(key){
  const t = THEMES[key]; if(!t) return;
  Object.entries(t.vars).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
  $$(".theme-btn").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.theme===key)));
  const nameEl = $("#themeName");
  if(nameEl) nameEl.textContent = t.label;
  try{ localStorage.setItem(CONFIG.site.storageKey,key); }catch(e){/* storage unavailable — theme just won't persist */}
  if(state.activeTab) renderTab(state.activeTab); // charts re-read CSS vars
}
function buildThemeSwitch(){
  $("#themeSwitch").innerHTML =
    `<span class="theme-name" id="themeName" aria-live="polite"></span>` +
    Object.entries(THEMES).map(([k,t])=>
      `<button class="theme-btn" data-theme="${k}" title="${esc(t.label)}" aria-label="${esc(t.label)} color scheme" aria-pressed="false" style="background:${t.swatch}"></button>`
    ).join("");
  $$(".theme-btn").forEach(b=> b.addEventListener("click",()=>applyTheme(b.dataset.theme)));
  let saved=null;
  try{ saved = localStorage.getItem(CONFIG.site.storageKey); }catch(e){}
  applyTheme(THEMES[saved] ? saved : "powerlite");
}

/* ==========================================================================
   STATE
   ========================================================================== */
const state = { activeTab:"overview", q:"", region:"all", status:"all", conf:"all", flag:"all", zoom:"full", sort:{key:"n",dir:1} };

function filteredTracks(){
  const q = state.q.trim().toLowerCase();
  let list = DATA.tracks.filter(t=>{
    if(state.region!=="all" && t.r!==state.region) return false;
    if(state.conf!=="all"   && t.conf!==state.conf) return false;
    if(state.status!=="all" && t.s!==state.status) return false;
    if(state.flag!=="all"   && t[state.flag]!==true) return false;
    if(!q) return true;
    return [t.n,t.c,t.co,regionLabel(t.r),STATUS[t.s].label,t.sanction,t.d,t.note,t.f,
            ...flagsOf(t).map(f=>FLAGS[f].label)]
      .join(" ").toLowerCase().includes(q);
  });
  const k=state.sort.key, dir=state.sort.dir;
  list.sort((a,b)=>{
    let va,vb;
    if(k==="r"){ va=regionLabel(a.r); vb=regionLabel(b.r); }
    else if(k==="s"){ va=STATUS[a.s].label; vb=STATUS[b.s].label; }
    else { va=a[k]??""; vb=b[k]??""; }
    return String(va).localeCompare(String(vb),undefined,{numeric:true})*dir;
  });
  return list;
}

/* ---------- TAB 1: OVERVIEW ---------- */
/* Compact, non-interactive rendering of the same outline + markers used on
   the full Map tab. Deliberately reuses `project`, `MAPS`, `markerPath` and
   `statusColor` rather than duplicating geometry, so the two maps can never
   drift out of sync. */
function buildMiniMapSvg(W,H){
  const map=MAPS.California, pad=10, view={bounds:map.bounds};
  const path = map.outline.map((p,i)=>{
    const [x,y]=project(p[0],p[1],view,W,H,pad);
    return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }).join(" ")+" Z";
  const order = t => isClosed(t) ? 0 : 1;
  const dots = DATA.tracks.slice().sort((a,b)=>order(a)-order(b)).map(t=>{
    const [x,y]=project(t.lat,t.lon,view,W,H,pad);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${statusColor(t.s)}" opacity="${confAlpha(t)*0.9}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true" focusable="false">
    <path class="state-land" d="${path}"/>${dots}
  </svg>`;
}

/* ---------- TAB 2: MAP ---------- */
/* ZOOM PRESETS — the two most crowded regions get a dedicated close-up.
   `bounds:null` means "use the full state." Add more the same way: any
   lat/lon box works, no new projection logic needed. */
const ZOOMS = {
  full:{label:"Full State", bounds:null},
  bay: {label:"Bay Area",   bounds:{latMin:36.9, latMax:38.9, lonMin:-123.3, lonMax:-121.0}},
  la:  {label:"LA Basin",   bounds:{latMin:33.35,latMax:34.95,lonMin:-119.1, lonMax:-117.0}}
};

function project(lat,lon,map,W,H,pad){
  const b=map.bounds;
  const k=Math.cos(((b.latMin+b.latMax)/2)*Math.PI/180);
  const xSpan=(b.lonMax-b.lonMin)*k, ySpan=(b.latMax-b.latMin);
  const scale=Math.min((W-2*pad)/xSpan,(H-2*pad)/ySpan);
  const offX=pad+((W-2*pad)-xSpan*scale)/2, offY=pad+((H-2*pad)-ySpan*scale)/2;
  return [ offX+((lon-b.lonMin)*k)*scale, offY+((b.latMax-lat))*scale ];
}

function renderMap(){
  const baseMap=MAPS.California, W=CONFIG.map.width, H=CONFIG.map.height, pad=CONFIG.map.padding;
  const zoomKey = ZOOMS[state.zoom] ? state.zoom : "full";
  const zoomBounds = ZOOMS[zoomKey].bounds || baseMap.bounds;
  const view = {bounds:zoomBounds};                 // what project() actually reads
  const margin = 0.08;                               // deg of lat/lon slack at the edge

  const path = baseMap.outline.map((p,i)=>{
    const [x,y]=project(p[0],p[1],view,W,H,pad);
    return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }).join(" ")+" Z";

  const cities = baseMap.cities
    .filter(c=> c.lat>=zoomBounds.latMin-margin && c.lat<=zoomBounds.latMax+margin &&
                c.lon>=zoomBounds.lonMin-margin && c.lon<=zoomBounds.lonMax+margin)
    .map(c=>{
      const [x,y]=project(c.lat,c.lon,view,W,H,pad);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.8" fill="var(--text-faint)" opacity=".7"/>
              <text x="${(x+6).toFixed(1)}" y="${(y+3.5).toFixed(1)}" font-size="10" font-family="var(--font-mono)" fill="var(--text-faint)" opacity=".85">${esc(c.name)}</text>`;
    }).join("");

  // Only draw tracks inside the current view — trimming these (rather than
  // relying on SVG clipping alone) keeps hover targets and the DOM light.
  const inView = t => t.lat>=zoomBounds.latMin-margin && t.lat<=zoomBounds.latMax+margin &&
                       t.lon>=zoomBounds.lonMin-margin && t.lon<=zoomBounds.lonMax+margin;
  const order = t => isClosed(t) ? 0 : 1;
  const markers = DATA.tracks.filter(inView).slice().sort((a,b)=>order(a)-order(b)).map(t=>{
    const [x,y]=project(t.lat,t.lon,view,W,H,pad);
    const st=STATUS[t.s], fx=+x.toFixed(1), fy=+y.toFixed(1);
    const deco = flagsOf(t).map(f=>flagPath(f,fx,fy)).join("");
    return `<g class="mk" data-i="${DATA.tracks.indexOf(t)}" tabindex="0" role="button"
              opacity="${confAlpha(t)}"
              aria-label="${esc(t.n)}, ${esc(t.c)}, ${esc(st.label)}">
       <circle class="mk-hit" cx="${fx}" cy="${fy}" r="15"/>
       ${deco}${markerPath(st.shape,fx,fy,statusColor(t.s))}
     </g>`;
  }).join("");

  const zoomBar = Object.entries(ZOOMS).map(([k,z])=>
    `<button class="zoom-btn" data-zoom="${k}" aria-pressed="${k===zoomKey}">${esc(z.label)}</button>`).join("");

  const legend = Object.entries(STATUS).map(([k,v])=>{
    const sw = `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">${markerPath(v.shape,11,11,v.color)}</svg>`;
    return `<span>${sw}${esc(v.label)}</span>`;
  }).join("");

  const flagLegend = Object.entries(FLAGS).map(([k,v])=>{
    const sw = `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">${flagPath(k,15,15)}${markerPath("ring",15,15,"var(--text-faint)")}</svg>`;
    return `<span>${sw}${esc(v.label)}</span>`;
  }).join("");

  return `
  <div class="sec-head"><h2>Where they are</h2><span class="rule"></span></div>
  <p class="sec-note">Every track in the atlas, plotted. Shape shows status; a ring or star marks a notable
    track; and <strong>the fainter a marker, the thinner the evidence behind it</strong> — opacity follows the
    confidence tier. Hover or tap for detail. Coordinates are city-level approximations for placement, not
    navigation. The filters here drive the Directory tab too.</p>

  <div class="zoom-bar" role="group" aria-label="Zoom to a region">${zoomBar}</div>

  ${controlsHTML()}
  <p class="result-count" id="mapCount"></p>

  <div class="map-shell">
    <svg id="mapSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of BMX tracks in California, ${esc(ZOOMS[zoomKey].label)} view">
      <path class="state-land" d="${path}"/>
      ${cities}
      ${markers}
    </svg>
    <div class="map-tip" id="mapTip" role="status"></div>
  </div>
  <div class="map-legend">
    ${legend}
    <span style="width:1px;height:20px;background:var(--line);padding:0"></span>
    ${flagLegend}
    <span style="width:1px;height:20px;background:var(--line);padding:0"></span>
    <span><svg width="46" height="16" viewBox="0 0 46 16" aria-hidden="true">
      <circle cx="8"  cy="8" r="5" fill="var(--text-dim)" opacity="1"/>
      <circle cx="23" cy="8" r="5" fill="var(--text-dim)" opacity=".72"/>
      <circle cx="38" cy="8" r="5" fill="var(--text-dim)" opacity=".45"/>
    </svg>Verified → estimated → draft</span>
  </div>`;
}

function tableRows(list){
  if(!list.length){
    return `<tr><td colspan="7"><div class="empty"><b>No tracks match</b>
      Try a broader search, or clear the filters to see all ${DATA.tracks.length} records.</div></td></tr>`;
  }
  return list.map(t=>{
    const st=STATUS[t.s];
    const name = t.w
      ? `<a href="${esc(t.w)}" target="_blank" rel="noopener noreferrer">${esc(t.n)}</a>`
      : esc(t.n);
    const badges = flagsOf(t).map(f=>
      `<span class="badge" title="${esc(FLAGS[f].note)}">${esc(FLAGS[f].short)}</span>`).join("");
    return `<tr>
      <td class="t-name">${name} ${badges}${t.d?`<span class="t-sub district">${esc(t.d)}</span>`:""}</td>
      <td>${esc(t.c)}<span class="t-sub">${esc(t.co)} County</span></td>
      <td>${esc(regionLabel(t.r))}</td>
      <td><span class="dot" style="background:${statusColor(t.s)}"></span>${esc(st.label)}</td>
      <td>${esc(t.f)}</td>
      <td>${esc(t.sanction)}</td>
      <td><span class="chip ${t.conf}">${esc(CONF[t.conf].label)}</span>${t.note?`<span class="t-sub">${t.note}</span>`:""}</td>
    </tr>`;
  }).join("");
}

function renderDirectory(){
  const cols=[["n","Track"],["c","City"],["r","Region"],["s","Status"],["f","Founded"],["sanction","Sanction"],["conf","Confidence & notes"]];

  return `

        <span class="mono" style="font-size:12px;color:var(--text-faint)">${count} records</span>
      </div>
      <p style="margin:0;font-size:13.5px;color:var(--text-dim)">${esc(v.note)}</p>
    </div>`;
  }).join("");

  const src = DATA.sources.map(([n,d])=>`<li><b>${n}</b><span>${d}</span></li>`).join("");

  return `
  <div class="sec-head"><h2>How this was built</h2><span class="rule"></span></div>
  <p class="sec-note">This atlas is a first-pass compilation, not a registry. California has had well over
    three hundred BMX tracks come and go since 1969 and most left almost no durable record — a phone number in
    a directory, a forum post, nothing else. What follows is what could be sourced, labelled by how well.</p>

  <div class="grid2">${tiers}</div>

  <div class="callout" style="margin-top:22px">
    <b>Two known gaps, in opposite directions.</b> For tracks that may still operate, about thirty records
    come from a single archived statewide directory dated around 2010–11. Those tracks existed then; whether
    they exist now would take a track-by-track check against current schedules. For closed tracks, most of the
    historic roster comes from rider-recollection forum threads — a genuinely valuable record, since almost
    nothing else survives, but one where riders openly correct each other's dates and locations mid-thread.
    Treat a Draft entry as evidence that a track existed, not as an authority on where or when.
  </div>

  <div class="callout" style="border-left-color:var(--warn)">
    <b>A worked example of why the tiers matter.</b> A widely repeated forum list places High Desert BMX in
    Barstow. Another rider, further down the same thread, corrects it: the track was his local, and it was in
    Hesperia. This atlas follows the correction and folds it into the active Hesperia record — but the original
    error had already been copied around for years. That is the Draft tier in one story.
  </div>

  <div class="sec" style="margin-top:26px">
    <div class="sec-head"><h2>Scope</h2><span class="rule"></span></div>
    <p class="sec-note">This covers sanctioned BMX <strong>race</strong> tracks — a start hill, a gate, berms and
      a scored moto. Pump tracks, dirt-jump parks and concrete BMX-friendly skateparks are a related but different
      category and are deliberately excluded, though several California cities have replaced a lost race track
      with exactly those facilities.</p>
  </div>

  <div class="sec">
    <div class="sec-head"><h2>Sources</h2><span class="rule"></span></div>
    <ul class="src-list">${src}</ul>
  </div>

  <div class="sec">
    <div class="sec-head"><h2>Extending this file</h2><span class="rule"></span></div>
    <p class="sec-note">The data and the rendering are kept apart on purpose. Open the file and look for the
      <span class="mono">CONFIG</span> and <span class="mono">DATA</span> blocks near the top of the script —
      adding a track, a region, a color scheme, a chart or a whole additional state is an edit to those objects,
      not to the rendering code. Each block carries a comment explaining what to change.</p>
  </div>`;
}

/* ==========================================================================
   TAB PLUMBING
   ========================================================================== */
function buildTabs(){
  $("#tabBar").innerHTML = TABS.map((t,i)=>
    `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-selected="false" aria-controls="panels">
      <span class="tab-n">${String(i+1).padStart(2,"0")}</span>${esc(t.label)}</button>`).join("");
  $$(".tab").forEach(b=> b.addEventListener("click",()=> goToTab(b.dataset.tab)));
}

/* Single entry point for switching tabs, used by the tab bar itself and by
   any in-page link that should jump to a tab (e.g. the Overview mini-map). */
function goToTab(id, opts){
  renderTab(id);
  if(history.replaceState) history.replaceState(null,"","#"+id);
  if(opts && opts.scrollToTabs){
    const bar = document.querySelector(".tabs");
    if(bar) bar.scrollIntoView({behavior:"smooth", block:"start"});
  }
}

function renderTab(id){
  const tab = TABS.find(t=>t.id===id) || TABS[0];
  state.activeTab = tab.id;
  $$(".tab").forEach(b=> b.setAttribute("aria-selected", String(b.dataset.tab===tab.id)));
  $("#panels").innerHTML = `<div class="panel" role="tabpanel" aria-labelledby="tab-${tab.id}">${tab.render()}</div>`;
  wireControls();
  if(tab.id==="map") wireMap();
  if(tab.id==="directory") wireTable();
  if(tab.id==="overview") wireOverview();
  updateCounts();
}

/* Generic collapsed-by-default story card — same visual pattern as the
   Palms Park card in the hero. Pass any DATA.* object shaped like
   {year, title, tease, facts, paragraphs}. `id` must be unique per card. */
function renderCollapseCard(id, data){
  const facts = data.facts
    ? `<div class="origin-facts">${data.facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</div>`
    : "";
  return `
  <div class="origin" id="${id}Card" data-open="false">
    <button class="origin-btn" id="${id}Btn" aria-expanded="false" aria-controls="${id}Body">
      <span class="origin-yr">${esc(data.year)}</span>
      <span class="origin-lab">
        <b>${esc(data.title)}</b>
        <span>${esc(data.tease)}</span>
      </span>
      <span class="origin-chev">▶</span>
    </button>
    <div class="origin-body hidden" id="${id}Body">
      ${data.paragraphs.map(p=>`<p>${p}</p>`).join("")}
      ${facts}
    </div>
  </div>`;
}

function wireCollapseCard(id){
  const card=$("#"+id+"Card"), btn=$("#"+id+"Btn"), body=$("#"+id+"Body");
  if(!card||!btn||!body) return;
  btn.addEventListener("click",()=>{
    const open = card.dataset.open === "true";
    card.dataset.open = String(!open);
    btn.setAttribute("aria-expanded", String(!open));
    body.classList.toggle("hidden", open);
  });
}

function wireOverview(){
  const b=$("#miniMapBtn");
  if(b) b.addEventListener("click",()=> goToTab("map",{scrollToTabs:true}));
  wireCollapseCard("silverDollar");
}

function wireControls(){
  const q=$("#q");
  if(q){
    q.addEventListener("input", e=>{ state.q=e.target.value; refreshFiltered(); });
    // keep focus + caret when re-rendering isn't needed
  }
  const bind=(sel,key)=>{ const el=$(sel); if(el) el.addEventListener("change",e=>{ state[key]=e.target.value; refreshFiltered(); }); };
  bind("#fRegion","region"); bind("#fStatus","status"); bind("#fConf","conf"); bind("#fFlag","flag");
  const c=$("#btnClear");
  if(c) c.addEventListener("click",()=>{
    state.q=""; state.region="all"; state.status="all"; state.conf="all"; state.flag="all";
    renderTab(state.activeTab);
  });
}

function refreshFiltered(){
  const list=filteredTracks();
  const body=$("#dirBody");
  if(body) body.innerHTML=tableRows(list);
  const keep=new Set(list.map(t=>DATA.tracks.indexOf(t)));
  $$("#mapSvg .mk").forEach(g=> g.classList.toggle("dim", !keep.has(+g.dataset.i)));
  updateCounts(list);
}

function updateCounts(list){
  list = list || filteredTracks();
  const n=list.length, total=DATA.tracks.length;
  const txt = n===total ? `Showing all ${total} tracks` : `Showing ${n} of ${total} tracks`;
  ["#dirCount","#mapCount"].forEach(s=>{ const el=$(s); if(el) el.textContent=txt; });
}

function wireTable(){
  $$("thead th[data-sort]").forEach(th=> th.addEventListener("click",()=>{
    const k=th.dataset.sort;
    state.sort = (state.sort.key===k) ? {key:k,dir:-state.sort.dir} : {key:k,dir:1};
    renderTab("directory");
  }));
}

function wireMap(){
  $$(".zoom-btn").forEach(b=> b.addEventListener("click",()=>{
    state.zoom = b.dataset.zoom;
    renderTab("map");
  }));
  const tip=$("#mapTip"), shell=$(".map-shell");
  const show=(g,evt)=>{
    const t=DATA.tracks[+g.dataset.i], st=STATUS[t.s];
    tip.innerHTML = `<b>${esc(t.n)}</b>
      <i>${esc(t.c)} · ${esc(t.co)} County</i>
      <i style="color:${statusColor(t.s)};margin-top:4px">${esc(st.label)}${t.f&&t.f!=="Unknown"?" · "+esc(t.f):""}</i>
      ${t.note?`<i style="margin-top:5px">${t.note.length>150?t.note.slice(0,150)+"…":t.note}</i>`:""}`;
    const r=shell.getBoundingClientRect();
    const bb=g.getBoundingClientRect();
    const x=bb.left-r.left+bb.width/2, y=bb.top-r.top;
    tip.style.opacity="1";
    tip.style.left=Math.max(6,Math.min(x-tip.offsetWidth/2, r.width-tip.offsetWidth-6))+"px";
    tip.style.top=Math.max(6,y-tip.offsetHeight-10)+"px";
  };
  const hide=()=> tip.style.opacity="0";
  $$("#mapSvg .mk").forEach(g=>{
    g.addEventListener("mouseenter",()=>show(g));
    g.addEventListener("focus",()=>show(g));
    g.addEventListener("mouseleave",hide);
    g.addEventListener("blur",hide);
    g.addEventListener("click",()=>show(g));
  });
  shell.addEventListener("mouseleave",hide);
}

/* ==========================================================================
   ORIGIN CARD
   ========================================================================== */
function buildOrigin(){
  const b=DATA.birthplace;
  $("#originYear").textContent=b.year;
  $("#originTitle").textContent=b.title;
  $("#originTease").textContent=b.tease;
  $("#originBody").innerHTML =
    b.paragraphs.map(p=>`<p>${p}</p>`).join("") +
    `<div class="origin-facts">${b.facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</div>`;

  const card=$("#originCard"), btn=$("#originBtn"), body=$("#originBody");
  btn.addEventListener("click",()=>{
    const open = card.dataset.open === "true";
    card.dataset.open = String(!open);
    btn.setAttribute("aria-expanded", String(!open));
    body.classList.toggle("hidden", open);
  });
}

/* Every 7s, give a random theme button a brief shimmer — a small "these are
   clickable" cue. Respects prefers-reduced-motion via the global CSS rule,
   which strips the animation entirely; the class still toggles harmlessly. */
function scheduleThemeShimmer(){
  setInterval(()=>{
    const btns = $$(".theme-btn");
    if(!btns.length) return;
    const b = btns[Math.floor(Math.random()*btns.length)];
    b.classList.remove("shimmer");
    void b.offsetWidth; // restart the animation if it's already mid-run
    b.classList.add("shimmer");
    setTimeout(()=> b.classList.remove("shimmer"), 1200);
  }, 7000);
}

/* ==========================================================================
   HERO ARTWORK
   Pushes CONFIG.hero onto the band as CSS variables. If `image` is empty the
   tile layer is simply never set and the band stays a plain dark panel, so a
   missing or not-yet-committed file degrades quietly rather than breaking.
   ========================================================================== */
function applyHeroArt(){
  const band = $("#heroBand"); if(!band) return;
  const h = CONFIG.hero || {};
  if(h.image){
    // encodeURI protects against spaces in the filename
    band.style.setProperty("--hero-art", `url("${encodeURI(h.image)}")`);
  }
  if(h.tileWidth) band.style.setProperty("--hero-tile", h.tileWidth + "px");
  if(h.scrim != null) band.style.setProperty("--hero-scrim", String(h.scrim));
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  $("#homeLink").href = CONFIG.site.homeUrl;
  $("#homeLink").textContent = "← " + CONFIG.site.name.split(" ").map(w=>w[0]).join("");
  $("#homeLink").title = "Back to " + CONFIG.site.name;

  const racingNow = DATA.tracks.filter(isRacing).length;
  $("#topSub").textContent = `${DATA.tracks.length} tracks · ${racingNow} confirmed racing`;
  $("#heroSub").innerHTML =
    `An atlas of ${DATA.tracks.length} BMX race tracks across California — the ones still running, the ones
     that closed, and the ones that came first. The sport began here in 1969 in a Los Angeles city park;
     today just ${racingNow} tracks in the state are confirmed to be holding races.`;
  $("#footText").innerHTML =
    `<strong>${esc(CONFIG.site.tool)}</strong> · ${esc(CONFIG.site.name)} · compiled ${esc(CONFIG.site.compiled)}. ` +
    `Single-file HTML, no external dependencies. Records carry individual confidence tiers — check the ` +
    `Method &amp; Sources tab before citing. <a href="${CONFIG.site.homeUrl}" target="_top">Back to ${esc(CONFIG.site.name)}</a>`;

  applyHeroArt();
  buildThemeSwitch();
  scheduleThemeShimmer();
  buildOrigin();
  buildTabs();
  const hash=(location.hash||"").replace("#","");
  renderTab(TABS.some(t=>t.id===hash) ? hash : "overview");
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
